services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: auto-cv-backend
    ports:
      - "8005:8005"
    volumes:
      - ./server_application/backend:/app/server_application/backend
      - ./src:/app/src
      - ./config:/app/config
      - ./assets:/app/assets
      - ./data:/app/data
    environment:
      - CV_CUSTOMIZER_ROOT=/app
      - AUTO_CV_DATA_ROOT=/app/data
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Set OLLAMA_HOST to reach the host system's Ollama server.
      # On Linux, make sure Ollama is listening on 0.0.0.0 (not just 127.0.0.1).
      # You can do this by setting OLLAMA_HOST=0.0.0.0:11434 on your host machine.
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - auto-cv-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: auto-cv-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - auto-cv-network

  # Optional: Ollama service for local LLM support
  ollama:
    image: ollama/ollama:latest
    container_name: auto-cv-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - auto-cv-network
    profiles:
      - with-ollama

networks:
  auto-cv-network:
    driver: bridge

volumes:
  ollama_data:
